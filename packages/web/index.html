<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Synchronous theme/prefs bootstrap: prevents flash of wrong theme on load -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('stream-theme');
          if (t === 'ink') document.documentElement.setAttribute('data-theme', 'ink');
          var d = JSON.parse(localStorage.getItem('stream-display') || '{}');
          if (d.accentColor && d.accentColor !== 'frost')
            document.documentElement.setAttribute('data-accent', d.accentColor);
          var sizes = { small: '14px', large: '18px' };
          if (sizes[d.textSize]) document.documentElement.style.fontSize = sizes[d.textSize];
          var fades = { none: '0', subtle: '0.35', full: '0.7' };
          if (fades[d.fadeLevel] !== undefined)
            document.documentElement.style.setProperty('--fade-max', fades[d.fadeLevel]);
          var fontUrls = {
            'ibm-plex':      'https://fonts.bunny.net/css?family=ibm-plex-sans:400,500,600,700|ibm-plex-serif:400,600&display=swap',
            'atkinson-lora': 'https://fonts.bunny.net/css?family=atkinson-hyperlegible:400,700|lora:400,600&display=swap'
          };
          if (d.fontPairing && d.fontPairing !== 'system' && fontUrls[d.fontPairing]) {
            document.documentElement.setAttribute('data-font', d.fontPairing);
            var pc = document.createElement('link');
            pc.rel = 'preconnect';
            pc.href = 'https://fonts.bunny.net';
            document.head.appendChild(pc);
            var fl = document.createElement('link');
            fl.rel = 'stylesheet';
            fl.href = fontUrls[d.fontPairing];
            document.head.appendChild(fl);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
